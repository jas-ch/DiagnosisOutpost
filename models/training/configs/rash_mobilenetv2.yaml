task: rash
model: mobilenetv2
input_size: [224, 224]
num_classes: 8
classes:
  - measles_like
  - chickenpox_like
  - hfmd_like
  - monkeypox_like
  - scarlet_fever_like
  - urticaria
  - impetigo_like
  - unclear
confidence_threshold: 0.55
batch_size: 32
epochs: 50
learning_rate: 0.0001
use_focal_loss: true
focal_gamma: 1.5
quantize: false
dataset_split:
  train: 0.7
  val: 0.15
  test: 0.15

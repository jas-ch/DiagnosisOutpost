task: cough
model: audio_cnn
input_size: [128, 128]  # spectrogram dimensions
num_classes: 5
classes:
  - dry_respiratory
  - productive_respiratory
  - whooping
  - wheeze_present
  - non_pathological_or_unclear
confidence_threshold: 0.55
sample_rate: 16000
clip_duration_seconds: 5
batch_size: 32
epochs: 50
learning_rate: 0.0001
quantize: false
dataset_split:
  train: 0.7
  val: 0.15
  test: 0.15
